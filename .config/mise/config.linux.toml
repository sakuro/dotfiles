[bootstrap.hooks.pre-packages]
run = '''
# apt index may be stale or empty, so refresh before installing any package
sudo apt-get update -q
. /etc/os-release
# Distro-specific package setup
case " $ID ${ID_LIKE:-} " in
*" ubuntu "*)
  sudo apt-get install -y --no-install-recommends software-properties-common
  # git-core/ppa provides a git new enough for config-based hooks
  # (`hook.<name>.command`, git 2.54+).
  sudo add-apt-repository -y ppa:git-core/ppa
  # refresh again to pick up the newly added PPA's index
  sudo apt-get update -q
  ;;
esac
'''

[bootstrap.packages]
"apt:dnsutils" = "latest"
"apt:git" = "latest"
"apt:less" = "latest"
"apt:locales" = "latest"
"apt:neovim" = "latest"
"apt:nethack-console" = "latest"
"apt:rsync" = "latest"
"apt:sqlite3" = "latest"
"apt:sudo" = "latest"
"apt:unzip" = "latest"
"apt:xdg-utils" = "latest"
"apt:zsh" = "latest"
"apt:zsh-autosuggestions" = "latest"
"apt:zsh-syntax-highlighting" = "latest"

[bootstrap.files."/etc/sudoers.d/nopasswd"]
source = "./files/sudoers.nopasswd.linux"
owner = "root"
group = "root"
mode = "0444"
