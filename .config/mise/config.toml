# [bootstrap.packages] section is separated in os specific config files.

[bootstrap.repos]
"~/.dotfiles" = { url = "https://github.com/sakuro/dotfiles.git" }

[bootstrap.user]
login_shell = "/bin/zsh"

[dotfiles]
"~/bin" = { mode = "symlink-each" }
"~/.config" = { mode = "symlink-each" }
"~/.zshenv" = { }

[tasks.bootstrap]
depends_post = ["os-specific-bootstrap"]

[tools]
bat = "0.26.1"
biome = "2.6.6"
difftastic = "0.72.0"
fnox = "1.48.0"
fzf = "0.75.0"
gh = "2.103.3"
hk = "2.11.1"
jq = "1.8.2"
node = "26.13.1"
op = "2.42.0"
pnpm = "12.18.0"
ripgrep = "15.2.0"
ruby = { version = "4.0.9", postinstall = "gem install repl_type_completor" }
zmx = "1.0.1"
"gem:fasti" = "1.0.1"
"github:damienbutt/emojify-go" = "1.0.1"
"github:sakuro/factorix" = "0.24.0"
"claude" = "2.1.321"
"codex" = "0.167.0"

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["ruby"]
minimum_release_age = "3d"

[settings.ruby]
verbose_install = true
ruby_build_opts = "--disable-install-doc"

[settings.self_update]
auto = true
