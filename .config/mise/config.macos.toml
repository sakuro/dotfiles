[env]
DOCKER_CONFIG = "{{ xdg_config_home }}/docker"

#[dotfiles]
#"~/.config/docker/config.json" = { source = "dotfiles/docker/config.json", mode = "copy" }

[bootstrap.packages]
"brew:bash" = "latest"
"brew:colima" = "latest"
"brew:coreutils" = "latest"
"brew:curl" = "latest"
"brew:diffutils" = "latest"
"brew:docker" = "latest"
"brew:docker-buildx" = "latest"
"brew:docker-compose" = "latest"
"brew:docker-credential-helper" = "latest"
"brew:findutils" = "latest"
"brew:gawk" = "latest"
"brew:git" = "latest"
"brew:gnu-sed" = "latest"
"brew:grep" = "latest"
"brew:imagemagick" = "latest"
"brew:inetutils" = "latest"
"brew:libyaml" = "latest"
"brew:ncurses" = "latest"
"brew:neovim" = "latest"
"brew:netpbm" = "latest"
"brew:pkgconf" = "latest"
"brew:pstree" = "latest"
"brew:rsync" = "latest"
"brew:watch" = "latest"
"brew:zsh-autosuggestions" = "latest"
"brew:zsh-completions" = "latest"
"brew:zsh-syntax-highlighting" = "latest"
"brew-cask:1password" = "latest"
"brew-cask:claude-code" = "latest"
"brew-cask:font-cica" = "latest"
"brew-cask:font-ricty-diminished" = "latest"
"brew-cask:google-chrome" = "latest"
"brew-cask:hammerspoon" = "latest"
"brew-cask:keyboard-cleaner" = "latest"
"brew-cask:keycastr" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:wezterm@nightly" = "latest"

[bootstrap.macos.launchd.agents.colima]
program = "/opt/homebrew/bin/colima"
args = ["start", "--foreground"]
run_at_load = true
keep_alive_on_failure = true
throttle_interval = 30
process_type = "Background"
working_directory = "~"
environment = { PATH = "/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin", DOCKER_CONFIG = "{{ xdg_config_home }}/docker" }
stdout_path = "~/Library/Logs/colima.log"
stderr_path = "~/Library/Logs/colima.err.log"

[bootstrap.macos.launchd.agents.ipconfig-verbose]
program = "/usr/bin/sudo"
args = ["/usr/sbin/ipconfig", "setverbose", "1"]
run_at_load = true

[bootstrap.files."/etc/sudoers.d/nopasswd"]
source = "./files/sudoers.nopasswd.macos"
owner = "root"
group = "wheel"
mode = "0444"

[tasks.link-git-credential-config]
run = "ln -fsv {{ xdg_config_home }}/git/include/credential.darwin {{ xdg_config_home }}/git/include/credential"

[tasks.link-git-signing-config]
run = '''
#!/usr/bin/env bash
# Signing goes through the 1Password SSH signer; skip when 1Password is not installed.
if [[ -x /Applications/1Password.app/Contents/MacOS/op-ssh-sign ]]; then
  ln -fsv "{{ xdg_config_home }}/git/include/signing.darwin" "{{ xdg_config_home }}/git/include/signing"
fi
'''

[tasks.set-hammerspoon-config-path]
run = "defaults write org.hammerspoon.Hammerspoon MJConfigFile '~/.config/hammerspoon/init.lua'"

[tasks.set-hammerspoon-input-methods]
run = '''
defaults write org.hammerspoon.Hammerspoon input-methods '{"en" = "英字　　（ATOK）"; "ja" = "ひらがな（ATOK）";}'
'''

[tasks.remove-legacy-hammerspoon-config]
run = '''
#!/usr/bin/env zsh
if [[ -f $HOME/.hammerspoon/init.lua ]]; then
  rm --verbose $HOME/.hammerspoon/init.lua
fi

if [[ -d $HOME/.hammerspoon ]]; then
  rmdir --verbose --parents $HOME/.hammerspoon
fi
'''

[tasks.os-specific-bootstrap]
depends = [
  "link-git-credential-config",
  "link-git-signing-config",
  "set-hammerspoon-config-path",
  "set-hammerspoon-input-methods",
  "remove-legacy-hammerspoon-config",
]
